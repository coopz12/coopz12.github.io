<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LUMEN — Halo One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080a;
  --panel:#0b0b0e;
  --ink:#f4f1ea;
  --ink-dim:color-mix(in srgb, var(--ink) 56%, transparent);
  --ink-faint:color-mix(in srgb, var(--ink) 34%, transparent);
  --line:color-mix(in srgb, var(--ink) 13%, transparent);
  --b:.72;
  --glow:rgba(255,178,102,.55);
  --glow-solid:#ffb266;
  --ease-out:cubic-bezier(.23,1,.32,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Sora',sans-serif;
  height:100dvh;overflow:hidden;
  display:grid;grid-template-rows:auto 1fr auto;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--glow-solid);color:#14100a}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus{outline:none}
:focus-visible{outline:2px solid var(--glow-solid);outline-offset:3px;border-radius:4px}

/* ---------- header ---------- */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 40px;border-bottom:1px solid var(--line);
}
.wordmark{font-weight:800;font-size:21px;letter-spacing:.14em}
.wordmark sup{font-size:9px;font-weight:600;letter-spacing:0;margin-left:2px}
.head-right{display:flex;align-items:center;gap:18px}
.head-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--ink-dim)}
.switch{
  width:48px;height:27px;border-radius:99px;flex:none;
  border:1px solid var(--line);position:relative;
  transition:background .25s var(--ease-out),border-color .25s var(--ease-out);
  background:color-mix(in srgb, var(--glow-solid) 26%, transparent);
}
.switch .knob{
  position:absolute;top:50%;left:3px;width:19px;height:19px;border-radius:50%;
  background:var(--ink);transform:translate(19px,-50%);
  transition:transform .25s var(--ease-out);
  box-shadow:0 1px 4px rgba(0,0,0,.5);
}
.switch[aria-checked="false"]{background:transparent}
.switch[aria-checked="false"] .knob{transform:translate(0,-50%);background:var(--ink-faint)}
.switch:active .knob{scale:.92}

/* ---------- main ---------- */
main{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(370px,.92fr);min-height:0}

/* stage */
.stage{position:relative;display:grid;place-items:center;min-height:0;overflow:hidden}
.orb{position:relative;width:min(54vh,480px);aspect-ratio:1}
.orb .halo{
  position:absolute;inset:-58%;border-radius:50%;
  background:radial-gradient(circle, var(--glow) 0%, transparent 56%);
  -webkit-mask-image:radial-gradient(circle, #000 46%, transparent 68%);
  mask-image:radial-gradient(circle, #000 46%, transparent 68%);
  opacity:calc(var(--b) * .9 + .04);
  transition:opacity .3s var(--ease-out);
  animation:breathe 7s ease-in-out infinite;
}
@keyframes breathe{0%,100%{scale:1}50%{scale:1.035}}
.orb .ring{position:absolute;inset:0;transform:rotate(-90deg)}
.orb .ring circle{fill:none;stroke-width:2.5}
.orb .ring .track{stroke:color-mix(in srgb, var(--ink) 12%, transparent)}
.orb .ring .arc{
  stroke:var(--glow-solid);stroke-linecap:round;
  transition:stroke .3s var(--ease-out);
}
.orb .core{
  position:absolute;inset:31%;border-radius:50%;
  background:radial-gradient(circle at 42% 38%, #fffdf8 0%, var(--glow-solid) 58%, color-mix(in srgb, var(--glow-solid) 55%, transparent) 100%);
  opacity:calc(var(--b) * .82 + .18);
  box-shadow:0 18px 60px -12px var(--glow), inset 0 -14px 30px rgba(0,0,0,.18);
  transition:opacity .3s var(--ease-out);
}
.stage .floor-glow{
  position:absolute;left:50%;bottom:9%;width:min(58vh,540px);height:56px;transform:translateX(-50%);
  background:radial-gradient(ellipse at center, var(--glow) 0%, transparent 65%);
  opacity:calc(var(--b) * .5);filter:blur(6px);
  transition:opacity .3s var(--ease-out);
}
.stage-cap{position:absolute;left:40px;bottom:26px}
.stage-cap .name{font-weight:600;font-size:16px;letter-spacing:.02em}
.stage-cap .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--ink-dim);margin-top:5px}
.stage-temp{
  position:absolute;right:40px;bottom:26px;text-align:right;
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--ink-dim);
}
.stage-temp b{display:block;font-size:15px;color:var(--ink);font-weight:500;letter-spacing:.04em;margin-bottom:4px}

/* panel */
.panel{
  border-left:1px solid var(--line);background:var(--panel);
  padding:34px 40px 30px;display:flex;flex-direction:column;gap:30px;
  min-height:0;overflow:hidden;
}
.ctl-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.ctl-label{font-weight:600;font-size:13px;letter-spacing:.16em;color:var(--ink-dim)}
.ctl-value{font-weight:800;font-size:44px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ctl-value small{font-size:19px;font-weight:600;color:var(--ink-dim);margin-left:2px}
.ctl-value .kval{font-size:30px}

input[type="range"]{
  -webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;cursor:pointer;display:block;
}
input[type="range"]::-webkit-slider-runnable-track{height:3px;border-radius:99px;background:var(--track, color-mix(in srgb, var(--ink) 16%, transparent))}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:23px;height:23px;border-radius:50%;margin-top:-10px;
  background:var(--ink);border:none;box-shadow:0 2px 8px rgba(0,0,0,.55);
  transition:scale .15s var(--ease-out);
}
input[type="range"]:active::-webkit-slider-thumb{scale:.9}
input[type="range"]::-moz-range-track{height:3px;border-radius:99px;background:color-mix(in srgb, var(--ink) 16%, transparent)}
input[type="range"]::-moz-range-progress{height:3px;border-radius:99px;background:var(--glow-solid)}
input[type="range"]::-moz-range-thumb{width:23px;height:23px;border-radius:50%;background:var(--ink);border:none;box-shadow:0 2px 8px rgba(0,0,0,.55)}
input[type="range"]:disabled{opacity:.32;cursor:default}
#temp{
  --track:linear-gradient(90deg,#ff9a3c,#ffc38a,#ffe9c9,#dfeaff);
}
#temp::-webkit-slider-runnable-track{background:var(--track)}
#temp::-moz-range-track{background:var(--track)}
#temp::-moz-range-progress{background:transparent}

.scenes{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.chip{
  border:1px solid var(--line);border-radius:12px;padding:12px 4px 11px;
  font-weight:600;font-size:13px;text-align:center;color:var(--ink-dim);
  transition:border-color .2s var(--ease-out),color .2s var(--ease-out),background .2s var(--ease-out),scale .12s var(--ease-out);
}
@media (hover:hover) and (pointer:fine){
  .chip:hover{border-color:color-mix(in srgb, var(--ink) 34%, transparent);color:var(--ink)}
  .buy:hover{box-shadow:0 6px 22px -6px var(--glow)}
}
.chip:active{scale:.96}
.chip[aria-pressed="true"]{
  border-color:var(--glow-solid);color:var(--glow-solid);
  background:color-mix(in srgb, var(--glow-solid) 9%, transparent);
}
.chip:disabled{opacity:.32;cursor:default}

.tele{border-top:1px solid var(--line)}
.tele .row{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:11px 0;border-bottom:1px solid var(--line);
  font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;
}
.tele .row .k{color:var(--ink-faint)}
.tele .row .v{color:var(--ink);font-variant-numeric:tabular-nums}

.buyrow{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.price{font-weight:800;font-size:29px;letter-spacing:-.01em}
.price small{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:400;color:var(--ink-dim);letter-spacing:.1em;margin-left:7px}
.buy{
  background:var(--ink);color:#101014;font-weight:600;font-size:15px;
  padding:15px 30px;border-radius:99px;
  box-shadow:0 2px 10px rgba(0,0,0,.4);
  transition:scale .13s var(--ease-out),box-shadow .25s var(--ease-out);
}
.buy:active{scale:.96}

/* ---------- footer ---------- */
footer{
  display:flex;justify-content:space-between;gap:16px;
  padding:16px 40px;border-top:1px solid var(--line);
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.11em;color:var(--ink-faint);
}

@media (prefers-reduced-motion: reduce){
  .orb .halo{animation:none}
  *{transition-duration:.01ms !important}
}

/* ---------- phone ---------- */
@media (max-width:760px){
  header{padding:15px 20px}
  .head-meta{display:none}
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,.9fr) auto}
  .stage{padding:6px 0 34px}
  .orb{width:min(32dvh,290px)}
  .stage-cap{left:20px;bottom:8px}
  .stage-cap .sub{display:none}
  .stage-temp{right:20px;bottom:8px}
  .panel{border-left:none;border-top:1px solid var(--line);padding:18px 20px 16px;gap:19px}
  .ctl-value{font-size:32px}
  .ctl-value .kval{font-size:23px}
  .ctl-head{margin-bottom:6px}
  input[type="range"]{height:38px}
  .tele .row{padding:8px 0}
  .tele .row:last-child{display:none}
  .buy{padding:13px 24px}
  .price{font-size:24px}
  footer{padding:12px 20px}
  footer .f-right{display:none}
}
</style>
</head>
<body>

<header>
  <div class="wordmark">LUMEN<sup>®</sup></div>
  <div class="head-right">
    <span class="head-meta">HALO ONE · MATTE BLACK</span>
    <button class="switch" id="power" role="switch" aria-checked="true" aria-label="Power">
      <span class="knob"></span>
    </button>
  </div>
</header>

<main>
  <section class="stage" aria-label="Halo One lamp preview">
    <div class="orb" aria-hidden="true">
      <div class="halo"></div>
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="47"></circle>
        <circle class="arc" id="arc" cx="50" cy="50" r="47"></circle>
      </svg>
      <div class="core"></div>
    </div>
    <div class="floor-glow" aria-hidden="true"></div>
    <div class="stage-cap">
      <div class="name">Halo One</div>
      <div class="sub">TUNABLE WHITE · 2200–6500K</div>
    </div>
    <div class="stage-temp"><b id="capTemp">3200K</b>COLOUR TEMP</div>
  </section>

  <section class="panel" aria-label="Light controls">
    <div class="ctl">
      <div class="ctl-head">
        <span class="ctl-label">BRIGHTNESS</span>
        <span class="ctl-value"><span id="bVal">72</span><small>%</small></span>
      </div>
      <input type="range" id="bright" min="1" max="100" value="72" aria-label="Brightness">
    </div>

    <div class="ctl">
      <div class="ctl-head">
        <span class="ctl-label">TEMPERATURE</span>
        <span class="ctl-value"><span class="kval" id="kVal">3200</span><small>K</small></span>
      </div>
      <input type="range" id="temp" min="2200" max="6500" step="50" value="3200" aria-label="Colour temperature">
    </div>

    <div class="ctl">
      <div class="ctl-head"><span class="ctl-label">SCENES</span></div>
      <div class="scenes" role="group" aria-label="Scenes">
        <button class="chip" data-scene="focus" aria-pressed="false">Focus</button>
        <button class="chip" data-scene="sunset" aria-pressed="false">Sunset</button>
        <button class="chip" data-scene="cinema" aria-pressed="false">Cinema</button>
        <button class="chip" data-scene="night" aria-pressed="false">Night</button>
      </div>
    </div>

    <div class="tele" aria-label="Telemetry">
      <div class="row"><span class="k">OUTPUT</span><span class="v" id="tLumens">1080 LM</span></div>
      <div class="row"><span class="k">DRAW</span><span class="v" id="tWatts">8.8 W</span></div>
      <div class="row"><span class="k">STATE</span><span class="v" id="tState">ON · MANUAL</span></div>
    </div>

    <div class="buyrow">
      <div class="price">$349<small>USD</small></div>
      <button class="buy" id="buy">Add to cart</button>
    </div>
  </section>
</main>

<footer>
  <span>© 2026 LUMEN LIGHTING CO.</span>
  <span class="f-right">FREE SHIPPING · 45-DAY RETURNS · 5-YEAR WARRANTY</span>
</footer>

<script>
'use strict';
const $ = id => document.getElementById(id);
const bright = $('bright'), temp = $('temp'), powerBtn = $('power');
const root = document.documentElement;
const CIRC = 2 * Math.PI * 47;
$('arc').style.strokeDasharray = CIRC;

const state = { on: true, b: 0.72, k: 3200, scene: null };
const SCENES = {
  focus:  { b: 0.92, k: 4700 },
  sunset: { b: 0.55, k: 2400 },
  cinema: { b: 0.30, k: 2700 },
  night:  { b: 0.12, k: 2200 }
};
/* kelvin to rgb, piecewise through four stops */
const STOPS = [
  [2200, [255, 154, 60]], [3200, [255, 195, 138]],
  [4700, [255, 233, 201]], [6500, [223, 234, 255]]
];
function kelvinRGB(k){
  for (let i = 0; i < STOPS.length - 1; i++){
    const [k0, c0] = STOPS[i], [k1, c1] = STOPS[i + 1];
    if (k >= k0 && k <= k1){
      const u = (k - k0) / (k1 - k0);
      return c0.map((v, j) => Math.round(v + (c1[j] - v) * u));
    }
  }
  return STOPS[STOPS.length - 1][1];
}
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
let tween = null;
function tweenTo(nb, nk, dur){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) dur = 1;
  const from = { b: state.b, k: state.k }, t0 = performance.now();
  if (tween) cancelAnimationFrame(tween);
  const step = now => {
    const u = Math.min(1, (now - t0) / dur), e = easeOutCubic(u);
    state.b = from.b + (nb - from.b) * e;
    state.k = from.k + (nk - from.k) * e;
    bright.value = Math.round(state.b * 100);
    temp.value = Math.round(state.k);
    apply();
    if (u < 1) tween = requestAnimationFrame(step);
  };
  tween = requestAnimationFrame(step);
}
function apply(){
  const visB = state.on ? state.b : 0;
  const [r, g, bl] = kelvinRGB(state.k);
  root.style.setProperty('--b', visB.toFixed(3));
  root.style.setProperty('--glow', `rgba(${r},${g},${bl},.55)`);
  root.style.setProperty('--glow-solid', `rgb(${r},${g},${bl})`);
  bright.style.setProperty('--track',
    `linear-gradient(90deg, rgb(${r},${g},${bl}) ${state.b * 100}%, rgba(244,241,234,.16) ${state.b * 100}%)`);
  $('arc').style.strokeDashoffset = (CIRC * (1 - visB)).toFixed(1);
  $('bVal').textContent = Math.round(state.b * 100);
  $('kVal').textContent = Math.round(state.k);
  $('capTemp').textContent = Math.round(state.k) + 'K';
  $('tLumens').textContent = state.on ? Math.round(1500 * state.b) + ' LM' : '0 LM';
  $('tWatts').textContent = state.on ? (0.6 + 11.4 * state.b).toFixed(1) + ' W' : '0.0 W';
  $('tState').textContent = !state.on ? 'OFF' :
    'ON · ' + (state.scene ? state.scene.toUpperCase() : 'MANUAL');
  document.querySelectorAll('.chip').forEach(c =>
    c.setAttribute('aria-pressed', String(state.on && c.dataset.scene === state.scene)));
}
function setControlsEnabled(){
  [bright, temp].forEach(el => el.disabled = !state.on);
  document.querySelectorAll('.chip').forEach(c => c.disabled = !state.on);
}
bright.addEventListener('input', () => {
  if (tween) cancelAnimationFrame(tween);
  state.b = bright.value / 100; state.scene = null; apply();
});
temp.addEventListener('input', () => {
  if (tween) cancelAnimationFrame(tween);
  state.k = +temp.value; state.scene = null; apply();
});
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const s = SCENES[chip.dataset.scene];
    state.scene = chip.dataset.scene;
    tweenTo(s.b, s.k, 340);
  });
});
powerBtn.addEventListener('click', () => {
  state.on = !state.on;
  powerBtn.setAttribute('aria-checked', String(state.on));
  setControlsEnabled(); apply();
});
$('buy').addEventListener('click', e => {
  const btn = e.currentTarget;
  if (btn.dataset.done) return;
  btn.dataset.done = '1';
  btn.textContent = 'Added to cart';
  setTimeout(() => { btn.textContent = 'Add to cart'; delete btn.dataset.done; }, 1700);
});
apply();
</script>
</body>
</html>

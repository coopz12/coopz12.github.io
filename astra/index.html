<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060f">
<title>ASTRA — Deep Field Observatory</title>
<meta name="description" content="A website you navigate like a star chart. Chart a course, fly the star lanes, dock at six bodies.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#6ee7ff;
  --accent-dim:rgba(110,231,255,.55);
  --ink:#f2f7ff;
  --ink-dim:rgba(242,247,255,.66);
  --ink-faint:rgba(242,247,255,.38);
  --glass:rgba(6,11,24,.74);
  --line:rgba(160,200,255,.16);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#04060f;color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
::selection{background:var(--accent);color:#04121a}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ---------- far space (screen-fixed parallax) ---------- */
.deepbg{position:fixed;inset:-12%;z-index:0;pointer-events:none;opacity:.9;
  background:radial-gradient(120% 100% at 50% 40%,#0a1230 0%,#04060f 62%);
  will-change:transform}
.stars-a,.stars-b{position:fixed;inset:-60%;z-index:1;pointer-events:none;will-change:background-position}
.stars-a{background-image:
  radial-gradient(1.4px 1.4px at 22px 34px,rgba(255,255,255,.95) 50%,transparent 51%),
  radial-gradient(1px 1px at 130px 90px,rgba(255,255,255,.7) 50%,transparent 51%),
  radial-gradient(1.2px 1.2px at 240px 160px,rgba(190,225,255,.85) 50%,transparent 51%),
  radial-gradient(.8px .8px at 320px 60px,rgba(255,255,255,.55) 50%,transparent 51%),
  radial-gradient(1px 1px at 60px 210px,rgba(255,255,255,.6) 50%,transparent 51%);
  background-size:380px 280px}
.stars-b{background-image:
  radial-gradient(1px 1px at 80px 120px,rgba(255,255,255,.5) 50%,transparent 51%),
  radial-gradient(1.6px 1.6px at 300px 300px,rgba(255,255,255,.85) 50%,transparent 51%),
  radial-gradient(.9px .9px at 190px 40px,rgba(200,230,255,.5) 50%,transparent 51%),
  radial-gradient(1.1px 1.1px at 420px 190px,rgba(255,255,255,.65) 50%,transparent 51%);
  background-size:520px 420px;opacity:.85}

/* ---------- chart world ---------- */
.viewport{position:fixed;inset:0;z-index:2;overflow:hidden;cursor:grab;touch-action:none}
.viewport.dragging{cursor:grabbing}
.world{position:absolute;left:0;top:0;width:5200px;height:3400px;transform-origin:0 0;will-change:transform}
#fieldLayer{position:absolute;inset:0}
#fieldLayer canvas{position:absolute;display:block}
.veil{position:absolute;inset:0;background:
  radial-gradient(120% 90% at 50% 50%,transparent 58%,rgba(2,4,10,.42) 100%);
  box-shadow:inset 0 0 340px rgba(2,4,10,.55)}
svg.chart{position:absolute;inset:0;width:5200px;height:3400px;display:block;pointer-events:none}
svg.cometSvg{position:absolute;inset:0;width:5200px;height:3400px;display:block;pointer-events:none;z-index:5}
.nodeLayer{position:absolute;inset:0;z-index:4}

/* star lanes */
.lane-glow{stroke-width:10;fill:none;opacity:.06}
.lane-core{stroke-width:1.6;fill:none;stroke-opacity:.3}
.lane-flow{stroke-width:3.2;fill:none;stroke:var(--accent);stroke-linecap:round;
  stroke-dasharray:0.1 17;opacity:0}
.lane.flown .lane-glow{opacity:.15}
.lane.flown .lane-core{stroke-opacity:.52}
.lane.flown .lane-flow{opacity:.75;animation:dashflow 1.15s linear infinite}
.lane.route .lane-glow{opacity:.22}
.lane.route .lane-core{stroke-opacity:.72}
.lane.route .lane-flow{opacity:1;stroke-dasharray:11 9;animation:dashroute .55s linear infinite;
  filter:drop-shadow(0 0 5px rgba(110,231,255,.8))}
@keyframes dashflow{to{stroke-dashoffset:-17.1}}
@keyframes dashroute{to{stroke-dashoffset:-20}}
.deco-star{fill:rgba(224,240,255,.8)}

/* ---------- bodies (photographic) ---------- */
.bnode{position:absolute;transform:translate(-50%,-50%);z-index:4;padding:0;text-align:center}
.bnode .orb{position:relative;border-radius:50%;overflow:hidden;margin:0 auto;
  border:1px solid rgba(255,255,255,.3);
  transition:transform .45s var(--ease)}
.bnode .orb img{width:100%;height:100%;object-fit:cover;display:block;
  transition:filter .5s,transform .6s var(--ease)}
.bnode .orb::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(88% 88% at 50% 46%,transparent 68%,rgba(1,3,9,.42) 100%);
  box-shadow:inset 0 0 34px rgba(1,3,9,.5)}
.bnode:hover .orb{transform:scale(1.045)}
.bnode:hover .orb img{transform:scale(1.06)}
.bnode.dim .orb img{filter:saturate(.6) brightness(.88)}
.bnode .selring,.bnode .selring2,.bnode .ping{position:absolute;border-radius:50%;pointer-events:none;
  left:50%;top:0;transform:translateX(-50%)}
.bnode .selring{border:1px solid var(--accent);opacity:0}
.bnode .selring2{border:1px dashed rgba(110,231,255,.5);opacity:0}
.bnode.current .selring{opacity:.95}
.bnode.current .selring2{opacity:.8;animation:spin 22s linear infinite}
@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
.bnode .ping{border:2px solid var(--accent);opacity:0}
.bnode.arrive .ping{animation:pingA .95s var(--ease)}
@keyframes pingA{0%{transform:translateX(-50%) scale(.55);opacity:1}100%{transform:translateX(-50%) scale(1.9);opacity:0}}
.bnode .blabel{position:absolute;left:50%;transform:translateX(-50%);width:340px;pointer-events:none}
.bnode .blabel .nm{display:block;font-weight:700;font-size:27px;letter-spacing:.16em;color:var(--ink);
  text-shadow:0 2px 14px rgba(0,0,0,.92),0 0 3px rgba(0,0,0,.9)}
.bnode .blabel .cl{display:block;font-family:"IBM Plex Mono",monospace;font-size:12.5px;
  letter-spacing:.34em;color:rgba(242,247,255,.62);text-transform:uppercase;margin-top:7px;
  text-shadow:0 2px 10px rgba(0,0,0,.92)}
.bnode.dim .blabel .nm{color:rgba(242,247,255,.66)}

/* warp streaks */
#warp{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .35s}

/* route tag */
.rtag{position:fixed;z-index:30;pointer-events:none;font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;letter-spacing:.16em;color:var(--ink);background:var(--glass);
  border:1px solid var(--line);border-radius:3px;padding:8px 11px;backdrop-filter:blur(8px);
  opacity:0;transform:translate(-50%,-150%);transition:opacity .25s;white-space:nowrap}
.rtag.show{opacity:1}
.rtag b{color:var(--accent)}

/* ---------- frame + HUD ---------- */
.frame{position:fixed;inset:12px;z-index:39;pointer-events:none}
.frame i{position:absolute;width:22px;height:22px;border:1px solid rgba(160,200,255,.35)}
.frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.hud{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;
  align-items:flex-start;padding:26px 34px 0;pointer-events:none}
.brand .word{font-weight:700;font-size:21px;letter-spacing:.42em;display:flex;align-items:center;gap:13px;
  text-shadow:0 2px 16px rgba(0,0,0,.85)}
.brand .word .dot{width:8px;height:8px;border-radius:99px;background:var(--accent);
  box-shadow:0 0 12px var(--accent);animation:blink 3.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.brand .word b{color:var(--accent);font-weight:700}
.brand .sub{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.42em;
  color:var(--ink-dim);margin-top:7px;text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.85)}
.status{text-align:center;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.3em;color:var(--ink-dim);text-transform:uppercase;padding-top:6px;
  text-shadow:0 2px 12px rgba(0,0,0,.9)}
.status b{color:var(--ink);font-weight:600}
.coords{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.13em;
  color:var(--ink-dim);line-height:1.95;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.coords b{color:var(--ink);font-weight:600}
.coords .lab{color:var(--ink-faint);font-size:9.5px;letter-spacing:.28em}

.deck{position:fixed;left:34px;right:34px;bottom:26px;z-index:40;display:flex;
  justify-content:space-between;align-items:flex-end;gap:14px;pointer-events:none}
.chip{background:rgba(4,7,16,.55);backdrop-filter:blur(8px);border:1px solid rgba(160,200,255,.1);
  border-radius:10px;padding:9px 13px}
.hint{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.22em;
  color:var(--ink-faint);text-transform:uppercase;line-height:2}
.hint b{color:var(--ink-dim);font-weight:500}
.log{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.22em;
  color:var(--ink-faint);text-transform:uppercase;text-align:right;line-height:2}
.log b{color:var(--accent);font-weight:600}
.zoomctl{display:flex;gap:8px;pointer-events:auto}
.zoomctl button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);
  background:var(--glass);backdrop-filter:blur(10px);font-size:17px;display:grid;place-items:center;
  transition:border-color .3s,transform .3s var(--ease)}
.zoomctl button:hover{border-color:var(--accent);transform:translateY(-2px)}
.zoomctl button.wide{width:auto;padding:0 15px;font-family:"IBM Plex Mono",monospace;
  font-size:9.5px;letter-spacing:.22em}

/* flight computer */
.flightlog{position:fixed;left:50%;bottom:104px;transform:translate(-50%,14px);z-index:55;
  min-width:min(430px,86vw);background:rgba(5,8,15,.92);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:3px;padding:13px 18px 14px;opacity:0;pointer-events:none;
  transition:opacity .4s,transform .4s var(--ease)}
.flightlog.show{opacity:1;transform:translate(-50%,0)}
.flightlog .fl-top{display:flex;justify-content:space-between;gap:18px;font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;letter-spacing:.18em}
.flightlog .fl-top .st{color:var(--accent);font-weight:600}
.flightlog .fl-route{font-weight:600;font-size:14.5px;letter-spacing:.05em;margin-top:6px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.flightlog .fl-bar{display:flex;gap:5px;margin-top:11px}
.flightlog .fl-bar i{flex:1;height:3px;background:rgba(160,200,255,.18)}
.flightlog .fl-bar i.done{background:var(--accent);box-shadow:0 0 8px rgba(110,231,255,.7)}
.flightlog .fl-bar i.now{background:var(--accent);animation:blink 0.8s ease-in-out infinite}

/* ---------- survey plate panel ---------- */
.panel{position:fixed;top:0;right:0;bottom:0;z-index:60;width:min(432px,94vw);
  background:#05080f;border-left:1px solid #31456b;
  transform:translateX(104%);transition:transform .65s var(--ease);display:flex;flex-direction:column;
  box-shadow:-30px 0 80px rgba(0,0,0,.6)}
body.docked .panel{transform:none}
.pstrip{display:flex;justify-content:space-between;align-items:center;flex:none;
  padding:11px 14px 11px 20px;border-bottom:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.3em;color:var(--ink-faint);
  text-transform:uppercase}
.pstrip b{color:var(--ink-dim);font-weight:500}
.closebtn{width:34px;height:34px;border:1px solid var(--line);font-size:13px;display:grid;place-items:center;
  transition:border-color .3s,background .3s}
.closebtn:hover{border-color:var(--accent);background:rgba(110,231,255,.08)}
.panel .ph{flex:none;position:relative}
.panel .ph img{width:100%;height:206px;object-fit:cover;display:block}
.pcap{display:flex;justify-content:space-between;gap:12px;padding:9px 20px;
  border-bottom:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:9px;
  letter-spacing:.22em;color:var(--ink-faint);text-transform:uppercase}
.pcap b{color:var(--ink-dim);font-weight:500}
.panel .pbody{padding:22px 26px 8px;overflow-y:auto;overscroll-behavior:contain}
.panel .kick{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.34em;
  color:var(--accent);text-transform:uppercase}
.panel h2{font-weight:700;font-size:28px;letter-spacing:.04em;line-height:1.2;margin:11px 0 11px}
.panel p{font-size:14.5px;line-height:1.68;color:var(--ink-dim);text-wrap:pretty}
.psec{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.32em;
  color:var(--ink-faint);text-transform:uppercase;margin:24px 0 4px;display:flex;align-items:center;gap:10px}
.psec::after{content:"";flex:1;height:1px;background:var(--line)}
.stats .row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;
  border-bottom:1px dotted rgba(160,200,255,.22)}
.stats .k{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.22em;
  color:var(--ink-faint);text-transform:uppercase;padding-top:2px}
.stats .v{font-size:13.5px;font-weight:500;text-align:right}
.stats .v .tag{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;
  color:var(--accent);margin-left:9px;font-weight:600}
.fp-row{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:12px 2px;
  border-bottom:1px solid rgba(160,200,255,.1);transition:background .25s,padding-left .25s var(--ease)}
.fp-row:hover{background:rgba(110,231,255,.06);padding-left:8px}
.fp-row .fi{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-faint);letter-spacing:.14em}
.fp-row .rn{font-weight:600;font-size:14.5px;letter-spacing:.03em;display:flex;align-items:center;gap:9px;white-space:nowrap}
.fp-row .rn .cdot{width:8px;height:8px;border-radius:99px;flex:none}
.fp-row .lead{flex:1;border-bottom:1px dotted rgba(160,200,255,.3);transform:translateY(-3px);min-width:14px}
.fp-row .rj{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.16em;color:var(--accent);white-space:nowrap}
.pfoot{flex:none;border-top:1px solid var(--line);padding:11px 20px;display:flex;justify-content:space-between;
  font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.24em;color:var(--ink-faint);text-transform:uppercase}
.pfoot .sig{color:var(--accent);letter-spacing:.1em}
.panel.swap-in .pbody>*{animation:rise .55s var(--ease) both}
.panel.swap-in .pbody>*:nth-child(2){animation-delay:.05s}
.panel.swap-in .pbody>*:nth-child(3){animation-delay:.1s}
.panel.swap-in .pbody>*:nth-child(4){animation-delay:.15s}
.panel.swap-in .pbody>*:nth-child(5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

@media (max-width:820px){
  .panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:64dvh;border-left:0;
    border-top:1px solid #31456b;transform:translateY(105%)}
  body.docked .panel{transform:none}
  .panel .ph img{height:132px}
  .hud{padding:19px 20px 0}
  .brand .word{font-size:16px}
  .status{display:none}
  .coords{display:none}
  .frame{inset:8px}
  .deck{left:20px;right:20px;bottom:16px}
  .hint{display:none}
  .log{display:none}
  .flightlog{bottom:auto;top:70px}
}
@media (prefers-reduced-motion:reduce){
  .lane.flown .lane-flow,.lane.route .lane-flow{animation:none}
  .bnode.current .selring2,.brand .word .dot{animation:none}
  .panel{transition-duration:.01ms}
}
</style>
</head>
<body>

<div class="deepbg" id="deepbg"></div>
<div class="stars-a" id="starsA"></div>
<div class="stars-b" id="starsB"></div>

<div class="viewport" id="viewport" role="application" aria-label="Star chart of the Astra observatory region. Drag to pan, scroll to zoom, select a body to chart a course to it.">
  <div class="world" id="world">
    <div id="fieldLayer"></div>
    <div class="veil"></div>
    <svg class="chart" viewBox="0 0 5200 3400">
      <defs id="defsRoot"></defs>
      <g id="decoLayer"></g>
      <g id="edgeLayer"></g>
    </svg>
    <div class="nodeLayer" id="nodeLayer"></div>
    <svg class="cometSvg" viewBox="0 0 5200 3400"><g id="cometLayer"></g></svg>
  </div>
</div>

<canvas id="warp"></canvas>
<div class="rtag" id="rtag"></div>
<div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<header class="hud">
  <div class="brand">
    <div class="word"><span class="dot"></span>ASTRA<b>.</b></div>
    <div class="sub">Deep Field Observatory</div>
  </div>
  <div class="status" id="statusOut">DOCKED · <b>ASTRA PRIME</b></div>
  <div class="coords" aria-hidden="true">
    <div><span class="lab">RA</span> <b id="raOut">12.00h</b> &nbsp; <span class="lab">DEC</span> <b id="decOut">+0.0°</b></div>
    <div><span class="lab">CHART SCALE</span> <b id="zoomOut">52%</b></div>
  </div>
</header>

<div class="deck">
  <div class="hint chip"><b>Drag</b> pan &nbsp;·&nbsp; <b>Scroll</b> zoom &nbsp;·&nbsp; <b>Click a body</b> chart course &nbsp;·&nbsp; <b>←→↑↓</b> jump routes</div>
  <div class="log chip" id="logOut">BODIES VISITED <b>1 / 6</b><br>ROUTES FLOWN <b>0</b></div>
  <div class="zoomctl">
    <button id="zoomOutBtn" aria-label="Zoom out">−</button>
    <button id="zoomInBtn" aria-label="Zoom in">+</button>
    <button id="resetBtn" class="wide">RESET CHART</button>
  </div>
</div>

<div class="flightlog" id="flightlog" aria-live="polite">
  <div class="fl-top"><span class="st" id="flState">IN TRANSIT</span><span id="flCount"></span></div>
  <div class="fl-route" id="flRoute"></div>
  <div class="fl-bar" id="flBar"></div>
</div>

<aside class="panel" id="panel" aria-label="Survey plate">
  <div class="pstrip">
    <span>ASTRA SURVEY · <b id="pPlate">PLATE 01 / 06</b></span>
    <button class="closebtn" id="closePanel" aria-label="Close plate, back to chart">✕</button>
  </div>
  <div class="ph">
    <img id="pImg" src="" alt="">
    <div class="pcap"><b id="pCap"></b><span id="pCoords"></span></div>
  </div>
  <div class="pbody">
    <div class="kick" id="pKick"></div>
    <h2 id="pTitle"></h2>
    <p id="pBody"></p>
    <div class="psec">Telemetry</div>
    <div class="stats" id="pStats"></div>
    <div class="psec">Flight plan</div>
    <div id="pRoutes"></div>
  </div>
  <div class="pfoot"><span>Signal <span class="sig" id="pSig"></span></span><span>Logged to survey</span></div>
</aside>

<script>
/* ================= data ================= */
const WORLD_W = 5200, WORLD_H = 3400;
const NODES = {
  prime:   { x:2600, y:1700, d:206, name:"ASTRA PRIME",   cls:"The Observatory", plate:"01", sig:5,
    col:"#ffd98c", orb:"assets/observatory.jpg", opos:"50% 50%", cap:"Dome at first light · Survey cam 01",
    body:"A white dome on a black summit, open to the darkest sky on the continent. Astra Prime is where every chart begins: the telescope, the archive, and the last hot coffee for four hundred miles.",
    stats:[["Elevation","4,204 m"],["First light","1987"],["Clear nights","287 / year"],["Resident astronomers","14"]] },
  nebula:  { x:1920, y:1270, d:166, name:"VEIL NEBULA",   cls:"Stellar Nursery", plate:"02", sig:4,
    col:"#a678ff", orb:"assets/nebula.jpg", opos:"46% 46%", cap:"False-color composite · NGC 6960",
    body:"The expanding shell of a star that tore itself apart eight thousand years ago. Gas moving at 1.5 million kilometres an hour, lit from inside by the newborn cluster it left behind.",
    stats:[["Distance","1,470 light-years"],["Expansion","1.5M km / hour"],["Catalog","NGC 6960"],["Best viewing","June to September"]] },
  exo:     { x:2170, y:2070, d:172, name:"KEPLER-186F",   cls:"Exoplanet Index", plate:"03", sig:3,
    col:"#3ecfa4", orb:"assets/exoplanet.jpg", opos:"50% 84%", cap:"Planet limb at terminator · Transit survey",
    body:"The first Earth-sized world found inside another star's habitable zone. Its sun is a red dwarf, its noon is a permanent amber dusk, and its seas, if they exist, have never seen a night sky like ours.",
    stats:[["Distance","582 light-years"],["Orbital period","130 days"],["Radius","1.17 × Earth"],["Status","Habitable zone"]] },
  lens:    { x:3020, y:1320, d:162, name:"THE GREAT LENS", cls:"The Telescope", plate:"04", sig:5,
    col:"#ffd76a", orb:"assets/star-amber.jpg", opos:"50% 50%", cap:"Target star · Coronagraph feed",

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const frand = mulberry32(20261012);
const CX = WORLD_W / 2, CY = WORLD_H / 2;
const falloff = (x, y) => {
  const r = Math.hypot((x - CX) / 2050, (y - CY) / 1340);
  const t = Math.min(1, Math.max(0, (r - 0.62) / 0.42));
  return 1 - 0.86 * (t * t * (3 - 2 * t));

const starList = [];
function pushStar(x, y, boost){
  const m = Math.pow(frand(), 2.6);
  starList.push({ x, y, r: 0.55 + m * 2.3 + (boost || 0), m,
    c: STAR_COLS[Math.floor(frand() * STAR_COLS.length)],
    a: Math.min(1, (0.3 + m * 0.85) * falloff(x, y)) });
}

  const x = frand() * WORLD_W, y = frand() * WORLD_H;
  if (frand() < falloff(x, y)) pushStar(x, y, 0);
}
const clusters = [];

  const a = frand() * Math.PI * 2, rr = Math.sqrt(frand()) * 0.55;
  clusters.push({ x: CX + Math.cos(a) * rr * 1800, y: CY + Math.sin(a) * rr * 1150, s: 46 + frand() * 95 });
}
clusters.forEach(cl => {
  const n = 130 + Math.floor(frand() * 150);
  for (let i = 0; i < n; i++){
    const gx = (frand() + frand() + frand() - 1.5) / 1.5, gy = (frand() + frand() + frand() - 1.5) / 1.5;
    pushStar(cl.x + gx * cl.s * 2.1, cl.y + gy * cl.s * 2.1, 0.35);
  }
});
const washes = [];
for (let i = 0; i < 15; i++){
  const a = frand() * Math.PI * 2, rr = Math.sqrt(frand()) * 0.72;
  washes.push({ x: CX + Math.cos(a) * rr * 1900, y: CY + Math.sin(a) * rr * 1250,
    r: 320 + frand() * 620,
    c: ["45,180,200","122,84,224","40,84,200","64,200,178"][Math.floor(frand() * 4)],
    a: 0.045 + frand() * 0.05 });
}
{
  const fl = document.getElementById("fieldLayer");
  const TW = 2600, TH = 1700;
  for (let ty = 0; ty < 2; ty++) for (let tx = 0; tx < 2; tx++){
    const cv = document.createElement("canvas");
    cv.width = TW; cv.height = TH;
    cv.style.left = (tx * TW) + "px"; cv.style.top = (ty * TH) + "px";
    cv.style.width = TW + "px"; cv.style.height = TH + "px";
    const ctx = cv.getContext("2d");
    ctx.translate(-tx * TW, -ty * TH);
    /* graticule */
    ctx.lineWidth = 1;
    for (let gx = 0; gx <= WORLD_W; gx += 260){
      ctx.strokeStyle = gx % 1300 === 0 ? "rgba(150,190,255,.085)" : "rgba(150,190,255,.042)";
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, WORLD_H); ctx.stroke();
    }
    for (let gy = 0; gy <= WORLD_H; gy += 260){
      ctx.strokeStyle = gy % 1300 === 0 ? "rgba(150,190,255,.085)" : "rgba(150,190,255,.042)";
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(WORLD_W, gy); ctx.stroke();

    ctx.globalCompositeOperation = "lighter";

      const g = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, w.r);
      g.addColorStop(0, `rgba(${w.c},${w.a})`);

    starList.forEach(s => {
      if (s.x < tx * TW - 30 || s.x > (tx + 1) * TW + 30 || s.y < ty * TH - 30 || s.y > (ty + 1) * TH + 30) return;

const viewport = document.getElementById("viewport");

let vw = innerWidth, vh = innerHeight;
const cam = { x: NODES.prime.x, y: NODES.prime.y, k: 0.32 };
const kMin = () => Math.max(vw / 4400, vh / 2900);
const clampK = k => Math.min(2.4, Math.max(kMin(), k));
function clampCam(){
  const hw = vw / 2 / cam.k, hh = vh / 2 / cam.k;
  cam.x = hw * 2 >= WORLD_W ? WORLD_W / 2 : Math.min(WORLD_W - hw, Math.max(hw, cam.x));
  cam.y = hh * 2 >= WORLD_H ? WORLD_H / 2 : Math.min(WORLD_H - hh, Math.max(hh, cam.y));
}

  world.style.transform = `translate(${vw/2}px, ${vh/2}px) scale(${cam.k}) translate(${-cam.x}px, ${-cam.y}px)`;
  deepbg.style.transform = `translate(${-cam.x * cam.k * 0.012}px, ${-cam.y * cam.k * 0.012}px)`;
  starsA.style.backgroundPosition = `${-cam.x * cam.k * 0.06}px ${-cam.y * cam.k * 0.06}px`;
  starsB.style.backgroundPosition = `${-cam.x * cam.k * 0.13}px ${-cam.y * cam.k * 0.13}px`;

const easeIO = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

    cam.y = from.y + (to.y - from.y) * e;
    cam.k = from.k + (to.k - from.k) * e;

    if (onFrame) onFrame(e);
    if (t < 1) anim = { id: requestAnimationFrame(stepFn) };
    else { anim = null; clampCam(); apply(); done && done(); }

const warpC = document.getElementById("warp"), wctx = warpC.getContext("2d");

let warpLevel = 0, warpTarget = 0, wStars = [];
function sizeWarp(){
  const dpr = Math.min(devicePixelRatio || 1, 1.5);
  warpC.width = vw * dpr; warpC.height = vh * dpr;
  wctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  wStars = Array.from({ length: 140 }, () => ({ a: Math.random() * Math.PI * 2, d: Math.random() * 0.5 + 0.04, s: 0.6 + Math.random() * 0.9 }));
}
function warpLoop(){
  requestAnimationFrame(warpLoop);
  warpLevel += (warpTarget - warpLevel) * 0.06;
  if (warpLevel < 0.02){ if (warpC.style.opacity !== "0") warpC.style.opacity = 0; return; }
  warpC.style.opacity = Math.min(1, warpLevel * 1.4);
  const cx = vw / 2, cy = vh / 2, maxR = Math.hypot(cx, cy);
  wctx.clearRect(0, 0, vw, vh);
  wctx.lineCap = "round";
  for (const st of wStars){
    const prev = st.d;
    st.d += st.d * 0.028 * warpLevel * st.s + 0.0006 * warpLevel;
    if (st.d > 1.15){ st.d = 0.03 + Math.random() * 0.1; st.a = Math.random() * Math.PI * 2; continue; }
    const r0 = prev * maxR, r1 = st.d * maxR;
    wctx.beginPath();
    wctx.moveTo(cx + Math.cos(st.a) * r0, cy + Math.sin(st.a) * r0);
    wctx.lineTo(cx + Math.cos(st.a) * r1, cy + Math.sin(st.a) * r1);
    wctx.strokeStyle = `rgba(190,235,255,${Math.min(0.85, st.d * 0.9 * warpLevel)})`;
    wctx.lineWidth = 1 + st.d * 1.6;
    wctx.stroke();
  }
}

/* ================= navigation ================= */
function bfs(from, to){
  if (from === to) return [from];
  const prev = { [from]: null }, q = [from];
  while (q.length){
    const c = q.shift();
    for (const nb of ADJ[c]) if (!(nb in prev)){ prev[nb] = c; if (nb === to){ q.length = 0; break; } q.push(nb); }
  }
  const path = []; let c = to;
  while (c){ path.unshift(c); c = prev[c]; }
  return path;
}
let current = "prime";
const visited = new Set(["prime"]);
const flown = new Set();
let traveling = false;
function refreshStates(){
  IDS.forEach(id => {
    const g = nodeEls[id];
    g.classList.toggle("visited", visited.has(id));
    g.classList.toggle("current", id === current);
    g.classList.toggle("dim", !visited.has(id) && id !== current);
  });
  for (const key in laneEls){
    const rev = key.split("|").reverse().join("|");
    laneEls[key].classList.toggle("flown", flown.has(key) || flown.has(rev));
  }
  document.getElementById("logOut").innerHTML =
    `BODIES VISITED <b>${visited.size} / 6</b><br>ROUTES FLOWN <b>${flown.size}</b>`;
  document.getElementById("statusOut").innerHTML = traveling
    ? `IN TRANSIT · <b>${NODES[current].name}</b>` : `DOCKED · <b>${NODES[current].name}</b>`;
}
const flightlog = document.getElementById("flightlog");
let flTimer = null;
function showFlight(state, route, legsDone, legsTotal, nowLeg){
  document.getElementById("flState").textContent = state;

  document.getElementById("flRoute").textContent = route;

    `<i class="${i < legsDone ? "done" : i === nowLeg ? "now" : ""}"></i>`).join("");

function hideFlight(delay){ clearTimeout(flTimer); flTimer = setTimeout(() => flightlog.classList.remove("show"), delay); }
function flyTo(target){
  if (traveling) return;

  clearRoutePreview();
  const path = bfs(current, target);
  const legs = path.slice(1);
  traveling = true; refreshStates();
  closePanel();
  warpTarget = reduced ? 0 : 1;
  showFlight("IN TRANSIT", `${NODES[path[0]].name} ▸ ${NODES[target].name}`, 0, legs.length, 0);
  const runLeg = i => {
    if (i >= legs.length){

    const midK = legs.length > 1 && i < legs.length - 1 ? Math.min(cam.k, 0.85) : 1.12;

      e => setComet(fromN.x + (n.x - fromN.x) * e, fromN.y + (n.y - fromN.y) * e, true));
  };

}

/* ================= input ================= */
const pointers = new Map();
let dragMoved = 0, lastPinch = 0, upInfo = { t: 0, d: 0 };
function cancelFlight(){
  if (anim){ cancelAnimationFrame(anim.id); anim = null; }
  if (traveling){ traveling = false; warpTarget = 0; setComet(0, 0, false); hideFlight(300); refreshStates(); }
}
viewport.addEventListener("pointerdown", e => {
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  dragMoved = 0;
  viewport.classList.add("dragging");
  cancelFlight();
});
addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  const p = pointers.get(e.pointerId);
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 1){
    dragMoved += Math.abs(dx) + Math.abs(dy);
    cam.x -= dx / cam.k; cam.y -= dy / cam.k;
    clampCam(); apply();
  } else if (pointers.size === 2){
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (lastPinch){
      const mid = { x:(a.x + b.x) / 2, y:(a.y + b.y) / 2 };
      zoomAt(mid.x, mid.y, cam.k * (d / lastPinch));
      dragMoved = 99;
    }
    lastPinch = d;
  }
});
const endPointer = e => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) lastPinch = 0;
  if (pointers.size === 0){
    viewport.classList.remove("dragging");
    upInfo = { t: performance.now(), d: dragMoved };
  }
};
addEventListener("pointerup", endPointer);
addEventListener("pointercancel", endPointer);
function zoomAt(sx, sy, nk){
  nk = clampK(nk);
  const wx = cam.x + (sx - vw/2) / cam.k, wy = cam.y + (sy - vh/2) / cam.k;
  cam.k = nk;
  cam.x = wx - (sx - vw/2) / nk; cam.y = wy - (sy - vh/2) / nk;
  clampCam(); apply();
}
viewport.addEventListener("wheel", e => {
  e.preventDefault();
  cancelFlight();
  zoomAt(e.clientX, e.clientY, cam.k * (e.deltaY < 0 ? 1.13 : 0.885));
}, { passive:false });
document.getElementById("zoomInBtn").addEventListener("click", () => tweenCam({ ...cam, k: clampK(cam.k * 1.35) }, 380));
document.getElementById("zoomOutBtn").addEventListener("click", () => tweenCam({ ...cam, k: clampK(cam.k / 1.35) }, 380));
document.getElementById("resetBtn").addEventListener("click", () => {
  closePanel(); cancelFlight(); traveling = true;
  tweenCam({ x:NODES.prime.x, y:NODES.prime.y, k:Math.max(0.55, kMin()) }, 900,
    () => { traveling = false; current = "prime"; refreshStates(); });
});
IDS.forEach(id => {
  const g = nodeEls[id];
  g.addEventListener("click", () => {
    if (performance.now() - upInfo.t < 400 && upInfo.d > 7) return;
    flyTo(id);
  });
  g.addEventListener("mouseenter", e => previewRoute(id, e));
  g.addEventListener("mousemove", e => { if (rtag.classList.contains("show")){ rtag.style.left = e.clientX + "px"; rtag.style.top = e.clientY + "px"; } });
  g.addEventListener("mouseleave", clearRoutePreview);
});
addEventListener("keydown", e => {
  if (e.key === "Escape"){ closePanel(); return; }
  const dirs = { ArrowRight:[1,0], ArrowLeft:[-1,0], ArrowUp:[0,-1], ArrowDown:[0,1] };
  if (dirs[e.key] && !traveling){
    e.preventDefault();
    const [dx, dy] = dirs[e.key], c = NODES[current];
    let best = null, bestScore = -2;
    ADJ[current].forEach(nb => {
      const n = NODES[nb], vx = n.x - c.x, vy = n.y - c.y, L = Math.hypot(vx, vy);
      const score = (vx * dx + vy * dy) / L;
      if (score > bestScore){ bestScore = score; best = nb; }
    });
    if (best && bestScore > 0.25) flyTo(best);
  }
  if (e.key === "+" || e.key === "=") tweenCam({ ...cam, k: clampK(cam.k * 1.3) }, 300);
  if (e.key === "-") tweenCam({ ...cam, k: clampK(cam.k / 1.3) }, 300);
  if (e.key === "0") document.getElementById("resetBtn").click();
});
addEventListener("resize", () => { vw = innerWidth; vh = innerHeight; sizeWarp(); clampCam(); apply(); });

/* ================= intro ================= */
cam.k = clampK(0.32);
refreshStates();
apply();
tweenCam({ x:NODES.prime.x, y:NODES.prime.y, k:1.04 }, 1500, () => {
  openPanel("prime");
  showFlight("CHART LIVE", "CLICK ANY BODY TO FLY THE LANES", 0, 0, -1);
  hideFlight(3200);
});
